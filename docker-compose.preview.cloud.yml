# Cloud shape of a preview: what kodus.io runs — billing, analytics, cloud
# mode on every backend process. Layered on top of docker-compose.preview.yml
# by .kodus/workspace.preview.yaml (runo --profile cloud).
services:
    kodus-api:
        environment:
            - API_CLOUD_MODE=true
    worker:
        environment:
            - API_CLOUD_MODE=true
    worker-analytics:
        environment:
            - API_CLOUD_MODE=true
    webhooks:
        environment:
            - API_CLOUD_MODE=true
    mcp-manager:
        environment:
            - API_CLOUD_MODE=true

    web:
        environment:
            - API_CLOUD_MODE=true
            # The billing proxy runs server-side inside this container, so it
            # must use Docker DNS rather than the browser's localhost.
            - WEB_HOSTNAME_BILLING=kodus-service-billing
            - WEB_PORT_BILLING=3992

    # Billing is a separate repository today. Runo checks it out during setup
    # and this overlay joins it to the same databases and networks as kodus-ai.
    # Only Stripe TEST credentials are accepted by the materialization script.
    kodus-service-billing:
        build:
            # Compose/BuildKit fetches this public repo directly. This keeps a
            # pre-existing Runo VM reconcilable too: it does not depend on a
            # one-time setup clone having run before `runo up`.
            context: https://github.com/kodustech/kodus-service-billing.git#main
            dockerfile: DockerFiles/Dockerfile.dev
        image: kodus-service-billing-preview:latest
        container_name: kodus-service-billing
        depends_on:
            db_postgres:
                condition: service_healthy
        env_file:
            - .env.billing
        environment:
            # The billing repo reads these directly at module import time.
            # Supplying them in the overlay keeps the generated secret file
            # independent of the URL, which Runo only knows after exposing VM.
            - CORS_URLS=${RUNO_PUBLIC_URL}
            - FRONTEND_URL=${RUNO_PUBLIC_URL}
        ports:
            - '3992:3992'
        restart: unless-stopped
        networks:
            - kodus-backend-services
            - shared-network
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3992/health/ready').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 12
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 256M
