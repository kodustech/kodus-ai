name: "Backend: Mutation Gate"

# Incremental mutation testing on the lines a PR changes. Coverage says a line
# ran; the mutation score says an assertion actually caught a change to it. This
# runs `pnpm mutation:diff`, which mutates changed lines in production .ts files
# and scopes the test run to nearby specs. Four shards keep the advisory score
# within a PR's time budget without dropping changed production code.
#
# ADVISORY ROLLOUT: the job is `continue-on-error`, and stryker.config.json sets
# thresholds.break=null, so it reports the score on the PR WITHOUT blocking the
# merge. To enforce it, set thresholds.break (e.g. 60) and drop the
# continue-on-error below.

on:
    pull_request:
        branches:
            - main
        paths:
            - "libs/**/*.ts"
            - "apps/**/*.ts"
            - "stryker.config.json"
            - "jest.stryker.config.ts"
            - "scripts/dev/mutation-diff.sh"
            - "scripts/dev/mutation-shard.cjs"
            - "scripts/dev/aggregate-mutation-reports.cjs"
            - ".github/workflows/mutation-gate.yml"

# Least privilege for the automatically-provisioned GITHUB_TOKEN. Without this
# block the job inherits the repository default, which is broad enough to write
# content and act on pull requests — and this job runs `pnpm install` plus
# Stryker, i.e. it executes dependency code and the PR's own code. Its three
# actions (checkout, setup-node, cache) only ever READ, so nothing here needs
# more. Matches contract-tests.yml, which already declares the same.
permissions:
    contents: read
    id-token: write # quality signal (report-signal action, WIF)

jobs:
    mutation-diff:
        name: Mutation shard ${{ matrix.shard }}
        runs-on: ubuntu-latest
        continue-on-error: true # advisory — reports, does not block (see header)
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4.1.7
              with:
                  # Full history so `git merge-base origin/<base> HEAD` works.
                  fetch-depth: 0

            - name: Fetch the PR base branch
              run: git fetch --no-tags origin "${{ github.base_ref }}"

            - name: Setup Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: "22"

            - name: Install pnpm
              # Must match package.json's "packageManager" (pnpm@11.9.0).
              run: npm i -g pnpm@11.9.0

            - name: Cache pnpm store
              uses: actions/cache@v5.0.5
              with:
                  path: ~/.local/share/pnpm/store
                  key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-node22-pnpm-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # libs/ee's environment.ts is gitignored, so it does not exist on a
            # fresh checkout, and @libs imports reach it transitively. Every
            # other test job creates this shim; this one did not, so Stryker's
            # DRY RUN died on MODULE_NOT_FOUND before a single mutant was
            # generated — the gate reported FAILURE while measuring nothing.
            - name: Create environment.ts
              run: |
                  cat <<'EOF' > libs/ee/configs/environment/environment.ts
                  import { environment as devEnvironment } from './environment.dev';

                  export const environment = devEnvironment;
                  EOF

            - name: Run the mutation gate on changed files
              id: run
              env:
                  MUTATION_SHARD_INDEX: ${{ matrix.shard }}
                  MUTATION_SHARD_COUNT: 4
              run: pnpm run mutation:diff "origin/${{ github.base_ref }}"

            - name: Record shard outcome
              if: always()
              env:
                  MUTATION_STEP_OUTCOME: ${{ steps.run.outcome }}
              run: |
                  mkdir -p reports/mutation
                  node -e 'require("fs").writeFileSync("reports/mutation/status.json", JSON.stringify({ outcome: process.env.MUTATION_STEP_OUTCOME }))'

            - name: Upload mutation shard
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mutation-report-${{ matrix.shard }}
                  path: |
                      reports/mutation/mutation.json
                      reports/mutation/status.json
                  if-no-files-found: error

    mutation-score:
        name: Mutation score on changed files
        needs: mutation-diff
        if: always()
        runs-on: ubuntu-latest
        continue-on-error: true
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4.1.7

            - name: Download mutation shards
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  pattern: mutation-report-*
                  path: mutation-artifacts

            - name: Aggregate mutation score
              id: score
              run: node scripts/dev/aggregate-mutation-reports.cjs mutation-artifacts 4

            - name: Report quality signal
              if: always()
              uses: ./.github/actions/report-signal
              with:
                  name: gate.mutation
                  status: ${{ steps.score.outputs.status || 'infra' }}
                  value: ${{ steps.score.outputs.value }}
                  unit: pct
                  meta: ${{ steps.score.outputs.meta }}
                  gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
                  gcp_sa_email: ${{ vars.GCP_SA_EMAIL }}
                  gcp_project: ${{ vars.GCP_PROJECT }}
