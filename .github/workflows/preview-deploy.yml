name: "Preview: Deploy"

# =============================================================================
# One preview environment per pull request AND per shape of the product it
# needs: the whole docker-compose stack the team runs locally, on a VM managed
# by runo (github.com/kodustech/runo), reachable over HTTPS.
#
# Kodus ships the same code as cloud (billing, analytics) and as self-hosted.
# A pull request may need neither, one or both previews; each shape is a runo
# env of its own (`--profile cloud` / `--profile self-hosted`). This workflow
# is a reconciler: it decides the wanted set, brings those up and tears the
# rest down, so the fleet always reflects the decision and nothing else.
#
# Who decides (scripts/preview/decide-profiles.cjs):
#   - labels, when present: preview:cloud, preview:self-hosted, preview:none.
#     Add or remove one and this workflow re-runs.
#   - otherwise rules over the changed files (docs-only → none; code that
#     reads the deployment mode → both; the rest → cloud).
#   - workflow_dispatch can force a set for one run.
#
# Replaces the Railway (API) + Vercel (web) pair. The reason is fidelity: a
# preview now runs the same containers as `pnpm run docker:start` — worker,
# webhooks, Mongo, Postgres, RabbitMQ — so a reviewer can exercise a whole
# review flow, not just render the frontend against a shared QA backend.
#
# Required secrets (environment "Preview"):
#   PREVIEW_RUNO_TOKEN        control-plane token; AWS and SSH stay on the server
#   Variable PREVIEW_RUNO_SERVER points to the isolated Ohio control plane
#   OP_SERVICE_ACCOUNT_TOKEN   renders .env from .env.template, the same way a
#                              developer does — so a variable added to the
#                              template does not silently break previews weeks
#                              later. Every vault-backed value is then stripped
#                              (see scripts/preview/neutralize-preview-env.sh):
#                              a public URL never boots with real credentials.
#   PREVIEW_SEED_PASSWORD      password of the seeded login (preview@kodus.io);
#                              signup enforces 8+ chars with an uppercase, a
#                              lowercase, a number and a symbol
#   PREVIEW_BILLING_ENV        allowlisted Stripe test configuration used by
#                              the isolated billing container; live keys fail
#                              closed before the workspace is uploaded
# =============================================================================

on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: Pull request to validate on the Ohio preview fleet
                required: true
                type: number
            profiles:
                description: Which shapes to bring up (auto = labels, then rules)
                required: false
                default: auto
                type: choice
                options: [auto, cloud, self-hosted, both, none]
    pull_request:
        # labeled/unlabeled: a preview:* label is a decision — act on it.
        # Labels applied by this workflow's own token never re-trigger it.
        types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read

concurrency:
    # A newer push supersedes the running deploy: `runo up` is idempotent and
    # the next run adopts the same VM and reconciles it, so cancelling costs
    # nothing but the wasted minutes.
    group: preview-${{ github.event.pull_request.number || inputs.pr_number }}
    cancel-in-progress: true

env:
    RUNO_HOME: /home/runner/.runo-preview-ohio
    RUNO_AWS_REGION: us-east-2
    RUNO_REF: main

jobs:
    preview:
        name: Preview environment
        # Secrets are not available to forks, and a fork branch name could
        # collide with ours in the env registry. Label events only matter
        # when the label is one of ours.
        if: >-
            (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
            && (github.event.action != 'labeled' && github.event.action != 'unlabeled' || startsWith(github.event.label.name, 'preview:'))
        runs-on: ubuntu-latest
        environment: Preview
        # two shapes come up one after the other
        timeout-minutes: 100
        permissions:
            contents: read
            pull-requests: write
        outputs:
            urls: ${{ steps.up.outputs.urls }}
            profiles: ${{ steps.decide.outputs.profiles }}
        steps:
            - name: Resolve preview revision
              id: target
              uses: actions/github-script@v9.0.0
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
              with:
                  script: |
                      const { data: pr } = await github.rest.pulls.get({
                        owner: context.repo.owner, repo: context.repo.repo,
                        pull_number: Number(process.env.PR_NUMBER),
                      });
                      if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                        throw new Error('Only same-repository previews are allowed');
                      }
                      core.setOutput('sha', pr.head.sha);
                      core.setOutput('branch', pr.head.ref);
            - uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ steps.target.outputs.sha }}

            - name: Use the isolated preview instance family
              run: |
                  # Older PRs still carry the previous fleet's instance family.
                  sed -i 's/instance: m7i-flex.xlarge/instance: t3.xlarge/' .kodus/workspace.preview*.yaml

            - name: Decide which shapes this pull request needs
              id: decide
              uses: actions/github-script@v9.0.0
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
                  FORCED: ${{ inputs.profiles || 'auto' }}
              with:
                  script: |
                      const { decide, PROFILES } = require(`${process.env.GITHUB_WORKSPACE}/scripts/preview/decide-profiles.cjs`);
                      const pull_number = Number(process.env.PR_NUMBER);
                      const forced = process.env.FORCED;
                      let decision;
                      if (forced && forced !== 'auto') {
                        const profiles = forced === 'both' ? [...PROFILES] : forced === 'none' ? [] : [forced];
                        decision = { profiles, reason: `workflow_dispatch: ${forced}`, source: 'manual' };
                      } else {
                        const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number });
                        const files = await github.paginate(github.rest.pulls.listFiles, { owner: context.repo.owner, repo: context.repo.repo, pull_number, per_page: 100 });
                        decision = decide({ labels: pr.labels.map((l) => l.name), files });
                      }
                      core.info(`profiles: [${decision.profiles.join(', ')}] — ${decision.reason} (${decision.source})`);
                      core.setOutput('profiles', decision.profiles.join(' '));
                      core.setOutput('unwanted', PROFILES.filter((p) => !decision.profiles.includes(p)).join(' '));
                      core.setOutput('reason', decision.reason);
                      core.setOutput('source', decision.source);

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install runo
              run: |
                  git clone --depth 1 --branch "$RUNO_REF" https://github.com/kodustech/runo.git "$RUNNER_TEMP/runo"
                  cd "$RUNNER_TEMP/runo"
                  bun install --frozen-lockfile
                  echo "RUNO=bun $RUNNER_TEMP/runo/bin/runo.ts" >> "$GITHUB_ENV"

            # unconditional: the `secrets` context is not available in a
            # step-level `if`, and the install is a couple of seconds
            - name: Install the 1Password CLI
              uses: 1password/install-cli-action@v1

            - name: Materialize the preview .env
              id: env
              env:
                  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
                  PREVIEW_SEED_PASSWORD: ${{ secrets.PREVIEW_SEED_PASSWORD }}
                  # Seeds the environment's signing keys. Deliberately NOT
                  # PREVIEW_SEED_PASSWORD: that one is handed to every reviewer,
                  # and anyone holding it could otherwise recompute a preview's
                  # JWT and crypto keys and mint sessions without logging in.
                  PREVIEW_SECRET_SEED_BASE: ${{ secrets.PREVIEW_SECRET_SEED }}
                  PREVIEW_BILLING_ENV: ${{ secrets.PREVIEW_BILLING_ENV }}
                  HEAD_REF: ${{ steps.target.outputs.branch }}
                  PROFILES: ${{ steps.decide.outputs.profiles }}
              run: |
                  # No token means previews are not configured for this
                  # repository (a fork, or before the secrets are added). That
                  # is not a broken pull request — skip quietly.
                  if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::OP_SERVICE_ACCOUNT_TOKEN is not set — skipping the preview environment"
                    exit 0
                  fi
                  echo "configured=true" >> "$GITHUB_OUTPUT"
                  # says which side is wrong when rendering fails, without
                  # printing anything secret (this repo's logs are public)
                  if op vault get Kodus-Dev >/dev/null 2>&1; then
                    echo "1Password: the service account can see the Kodus-Dev vault"
                  else
                    echo "::warning::the service account cannot 'vault get' Kodus-Dev — if the render fails below, the token is missing that vault grant (recreate it with: op service-account create <name> --vault Kodus-Dev:read_items)"
                  fi
                  # the repo's own renderer, so the set of variables always
                  # matches .env.template
                  ./scripts/env/pull.sh --force
                  # unique per environment, identical across runs of the same
                  # one: pushing to a PR must not invalidate the session of
                  # whoever is looking at its preview. Without the secret the
                  # script falls back to random values, which is safe but makes
                  # each run a new environment as far as sessions go.
                  if [ -n "$PREVIEW_SECRET_SEED_BASE" ]; then
                    export PREVIEW_SECRET_SEED="$PREVIEW_SECRET_SEED_BASE:$HEAD_REF"
                  else
                    echo "::warning::PREVIEW_SECRET_SEED is not set — this preview's signing keys are random and change on every push, so anyone logged into it gets signed out. Set the secret to make them stable per environment."
                  fi
                  # ...and then nothing real survives into a public environment
                  ./scripts/preview/neutralize-preview-env.sh .env .env.template
                  # billing exists in the cloud shape only
                  case " $PROFILES " in *" cloud "*)
                    printf '%s\n' "$PREVIEW_BILLING_ENV" > "$RUNNER_TEMP/preview-billing.env"
                    ./scripts/preview/materialize-billing-env.sh \
                      "$RUNNER_TEMP/preview-billing.env" .env .env.billing
                  esac
                  # the seed runs on the VM and reads these from the same file
                  {
                    echo "PREVIEW_SEED_EMAIL=preview@kodus.io"
                    echo "PREVIEW_SEED_PASSWORD=$PREVIEW_SEED_PASSWORD"
                  } >> .env
                  chmod 600 .env

            - name: Bring the environment up
              id: up
              if: steps.env.outputs.configured == 'true'
              env:
                  RUNO_SERVER: ${{ vars.PREVIEW_RUNO_SERVER }}
                  RUNO_TOKEN: ${{ secrets.PREVIEW_RUNO_TOKEN }}
                  HEAD_REF: ${{ steps.target.outputs.branch }}
                  PROFILES: ${{ steps.decide.outputs.profiles }}
                  UNWANTED: ${{ steps.decide.outputs.unwanted }}
              run: |
                  set -euo pipefail
                  : "${RUNO_SERVER:?PREVIEW_RUNO_SERVER is not configured}"
                  : "${RUNO_TOKEN:?PREVIEW_RUNO_TOKEN is not configured}"
                  # Previews created before shapes existed carry no profile.
                  # One of those for this branch would sit next to the new
                  # ones until the PR closed, so retire it first (the closing
                  # cleanup would take it anyway; this just does it sooner).
                  if $RUNO environments | jq -e --arg b "$HEAD_REF" \
                       'map(select(.repo == "kodus-ai" and .branch == $b and (.profile // "") == "")) | length > 0' >/dev/null; then
                    echo "retiring the pre-profile preview of $HEAD_REF"
                    $RUNO destroy --branch "$HEAD_REF" --recipe .kodus/workspace.preview.yaml
                  fi
                  # Reconcile: a shape the PR no longer wants goes away (a
                  # no-op when it never existed), the wanted ones come up.
                  for profile in $UNWANTED; do
                    recipe=.kodus/workspace.preview.yaml
                    [ "$profile" = self-hosted ] && recipe=.kodus/workspace.preview.selfhosted.yaml
                    $RUNO destroy --branch "$HEAD_REF" --profile "$profile" --recipe "$recipe"
                  done
                  urls=""
                  for profile in $PROFILES; do
                    url=$(./scripts/preview/up-profile.sh "$profile" "$HEAD_REF")
                    echo "Preview [$profile]: $url"
                    urls="$urls$profile=$url "
                  done
                  echo "urls=${urls% }" >> "$GITHUB_OUTPUT"

            - name: Report container status
              if: always() && steps.env.outputs.configured == 'true'
              env:
                  RUNO_SERVER: ${{ vars.PREVIEW_RUNO_SERVER }}
                  RUNO_TOKEN: ${{ secrets.PREVIEW_RUNO_TOKEN }}
                  HEAD_REF: ${{ steps.target.outputs.branch }}
                  PROFILES: ${{ steps.decide.outputs.profiles }}
              run: |
                  # Keep public Actions logs free of request bodies, headers,
                  # token-bearing URLs, and Stripe payloads. Detailed logs are
                  # available through the authenticated Runo exec/logs path.
                  for profile in $PROFILES; do
                    overlay=docker-compose.preview.cloud.yml
                    [ "$profile" = self-hosted ] && overlay=docker-compose.preview.selfhosted.yml
                    echo "== $profile"
                    $RUNO exec --branch "$HEAD_REF" --profile "$profile" -- \
                      "docker compose -f docker-compose.dev.yml -f docker-compose.preview.yml -f $overlay --profile mcp ps" || true
                  done

            - name: Comment the preview link
              if: always() && github.event_name == 'pull_request' && steps.env.outputs.configured == 'true'
              uses: actions/github-script@v9.0.0
              env:
                  URLS: ${{ steps.up.outputs.urls }}
                  OUTCOME: ${{ steps.up.outcome }}
                  PROFILES: ${{ steps.decide.outputs.profiles }}
                  REASON: ${{ steps.decide.outputs.reason }}
                  SOURCE: ${{ steps.decide.outputs.source }}
              with:
                  script: |
                      const marker = '## Preview Environment';
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const stamp = `_Updated ${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC · [logs](${runUrl})_`;
                      const wanted = (process.env.PROFILES || '').split(' ').filter(Boolean);
                      const urls = Object.fromEntries((process.env.URLS || '').split(' ').filter(Boolean).map((kv) => kv.split(/=(.*)/s).slice(0, 2)));
                      const label = { cloud: 'Cloud (billing, analytics)', 'self-hosted': 'Self-hosted (no billing, `API_CLOUD_MODE=false`)' };
                      const decided = `Shapes: ${wanted.length ? wanted.join(' + ') : 'none'} — ${process.env.REASON} (${process.env.SOURCE}). ` +
                        'Override with the labels `preview:cloud`, `preview:self-hosted` or `preview:none`.';
                      let body;
                      if (process.env.OUTCOME === 'success' && wanted.length === 0) {
                        body = [marker, '', 'No preview for this pull request.', '', decided, '', stamp].join('\n');
                      } else if (process.env.OUTCOME === 'success') {
                        body = [
                          marker,
                          '',
                          ...wanted.map((p) => `- **${label[p] ?? p}**: ${urls[p] ? `**${urls[p]}**` : '_failed_'}`),
                          '',
                          'Full stack (web, api, worker, webhooks, MCP, mongo, postgres, rabbit) on one VM per shape.',
                          'Login: `preview@kodus.io` — password is the `PREVIEW_SEED_PASSWORD` secret.',
                          '',
                          decided,
                          '',
                          'Each VM suspends itself after 60min idle; a new push wakes it and updates this link.',
                          '',
                          stamp,
                        ].join('\n');
                      } else {
                        body = [marker, '', `Preview failed to come up — [see the logs](${runUrl}).`, '', decided].join('\n');
                      }

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });
                      const existing = comments.find((c) => c.body.includes(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
