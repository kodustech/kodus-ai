name: 'Report quality signal'
description: 'Write one row, or a list of rows, to quality.signals through kodus-quality (see docs/quality-signals.md)'

# One block per workflow, always with `if: always()`, so red runs are rows too.
# Rows go to kodus-quality's POST /api/ingest, authenticated by this job's own
# GitHub OIDC token (audience kodus-quality), so no secret is passed. The
# caller needs
#     permissions:
#         id-token: write
#
# Graceful degradation, like discord-notify: without an OIDC token (fork, or
# the permission is missing) we warn and exit 0, and the post step is
# continue-on-error. This is telemetry: it never turns a green gate red. A
# missing row shows up as a gap in the series, which the dashboard makes
# visible.

inputs:
    name:
        description: '<area>.<gate>[.<dimension>], e.g. evals.nightly.recall. Required unless rows is set'
        required: false
        default: ''
    status:
        description: 'green | yellow | red | skipped | infra, or a GitHub job status (success | failure | cancelled | skipped), which is mapped. Required unless rows is set'
        required: false
        default: ''
    rows:
        description: 'Path to a JSON array of {name, status, value, unit, meta}: several rows in one insert, each checked like a single one (a bad row is dropped with a warning). Replaces name/status/value/unit/meta'
        required: false
        default: ''
    value:
        description: 'Optional number'
        required: false
        default: ''
    unit:
        description: 'ratio | count | usd | ms | pct'
        required: false
        default: ''
    meta:
        description: 'Optional JSON object as a string'
        required: false
        default: ''
    run_url:
        description: 'Defaults to this run'
        required: false
        default: ''
    source:
        description: 'Defaults to <repo>/<workflow file>'
        required: false
        default: ''
    gcp_wif_provider:
        description: 'Deprecated and ignored: rows no longer go to BigQuery. Kept so existing callers do not warn'
        required: false
        default: ''
    gcp_sa_email:
        description: 'Deprecated and ignored: rows no longer go to BigQuery. Kept so existing callers do not warn'
        required: false
        default: ''
    gcp_project:
        description: 'Deprecated and ignored: rows no longer go to BigQuery. Kept so existing callers do not warn'
        required: false
        default: ''

runs:
    using: composite
    steps:
        - name: Build row
          id: row
          # Telemetry: a bad status, name or value is the producer's bug, reported
          # as a failed step of this action, never as a red gate for the caller.
          continue-on-error: true
          shell: bash
          env:
              IN_NAME: ${{ inputs.name }}
              IN_STATUS: ${{ inputs.status }}
              IN_VALUE: ${{ inputs.value }}
              IN_UNIT: ${{ inputs.unit }}
              IN_META: ${{ inputs.meta }}
              IN_RUN_URL: ${{ inputs.run_url }}
              IN_SOURCE: ${{ inputs.source }}
              IN_ROWS: ${{ inputs.rows }}
              GH_REPO: ${{ github.repository }}
              GH_WORKFLOW_REF: ${{ github.workflow_ref }}
              GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              # On pull_request the default sha/ref are the synthetic merge commit and '<n>/merge'.
              GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              GH_REF: ${{ github.head_ref || github.ref_name }}
          run: |
              node -e '
                const map = { success: "green", failure: "red", cancelled: "infra", skipped: "skipped" };
                const allowed = new Set(["green", "yellow", "red", "skipped", "infra"]);
                // github.workflow_ref = owner/repo/.github/workflows/<file>@<ref>
                const file = (process.env.GH_WORKFLOW_REF.match(/\.github\/workflows\/([^@]+)@/) || [])[1] || "unknown";
                const source = process.env.IN_SOURCE.trim() || `${process.env.GH_REPO.split("/")[1]}/${file}`;
                // One row, or an Error naming what the producer got wrong.
                const build = (input) => {
                  const raw = String(input.status ?? "").trim().toLowerCase();
                  const status = map[raw] || raw;
                  if (!allowed.has(status)) throw new Error(`unknown status "${raw}"`);
                  // Producers interpolate model ids and similar into names: fold them to the contract
                  // (lowercase, [a-z0-9._-]) instead of failing, e.g. evals.tier0.minimax-m3@nvidia -> ..._nvidia.
                  const name = String(input.name ?? "").trim().toLowerCase().replace(/[^a-z0-9._-]+/g, "_");
                  // Accept exactly what the fold can produce. Only a name without a dot is still a producer bug.
                  if (!/^[a-z0-9_-]+(\.[a-z0-9_-]+)+$/.test(name)) throw new Error(`bad name "${name}": want <area>.<gate>[.<dimension>]`);
                  const rawValue = input.value === null || input.value === undefined ? "" : String(input.value).trim();
                  const value = rawValue === "" ? null : Number(rawValue);
                  if (value !== null && Number.isNaN(value)) throw new Error(`value is not a number: ${rawValue}`);
                  let meta = null;
                  if (input.meta !== null && typeof input.meta === "object") meta = JSON.stringify(input.meta);
                  else if (String(input.meta ?? "").trim() !== "") {
                    // A producer that interpolated an empty step output ends up with {"total": } (invalid).
                    // Telemetry must not fail the job: keep the raw text and warn.
                    try { meta = JSON.stringify(JSON.parse(input.meta)); }
                    catch { console.log(`::warning::report-signal: meta is not valid JSON, recorded as raw text`); meta = JSON.stringify({ raw_meta: input.meta }); }
                  }
                  return {
                    ts: new Date().toISOString(), source, name, status, value,
                    unit: String(input.unit ?? "").trim() || null,
                    run_url: process.env.IN_RUN_URL.trim() || process.env.GH_RUN_URL,
                    commit: process.env.GH_SHA, branch: process.env.GH_REF, meta,
                  };
                };
                let rows = [];
                if (process.env.IN_ROWS.trim()) {
                  let inputs;
                  try { inputs = JSON.parse(require("fs").readFileSync(process.env.IN_ROWS.trim(), "utf8")); }
                  catch (e) { console.error(`report-signal: cannot read rows from ${process.env.IN_ROWS}: ${e.message}`); process.exit(1); }
                  if (!Array.isArray(inputs)) { console.error("report-signal: rows must be a JSON array"); process.exit(1); }
                  for (const input of inputs) {
                    try { rows.push(build(input)); }
                    catch (e) { console.log(`::warning::report-signal: row dropped: ${e.message}`); }
                  }
                  if (!rows.length) { console.error("report-signal: no valid row to write"); process.exit(1); }
                } else {
                  try { rows = [build({ name: process.env.IN_NAME, status: process.env.IN_STATUS, value: process.env.IN_VALUE, unit: process.env.IN_UNIT, meta: process.env.IN_META })]; }
                  catch (e) { console.error(`report-signal: ${e.message}`); process.exit(1); }
                }
                require("fs").writeFileSync("quality-signal-row.json", rows.map((r) => JSON.stringify(r)).join("\n") + "\n");
                for (const r of rows) console.log(JSON.stringify(r));
              '

        - name: Post rows to kodus-quality
          if: steps.row.outcome == 'success'
          # Telemetry: never turns a green gate red.
          continue-on-error: true
          shell: bash
          run: |
              if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                  echo "::warning::no OIDC token (the caller needs permissions: id-token: write; forks get none): quality signal not recorded."
                  exit 0
              fi
              token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kodus-quality" | jq -r .value)
              jq -cs '{table: "signals", rows: .}' quality-signal-row.json > quality-signal-body.json
              curl -sS --fail-with-body -X POST https://quality.kodus.io/api/ingest \
                  -H "Authorization: Bearer $token" -H 'content-type: application/json' \
                  --data-binary @quality-signal-body.json | tee quality-signal-answer.json
              echo
              jq -r '.dropped[]? | "::warning::report-signal: row \(.index) dropped: \(.reason)"' quality-signal-answer.json
              rm -f quality-signal-row.json quality-signal-body.json quality-signal-answer.json
