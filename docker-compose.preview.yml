# Overlay for runo preview environments (one VM per PR).
#
# Layered on top of docker-compose.dev.yml — a preview runs the SAME stack the
# team runs locally, so a reviewer sees what a developer sees. Only two things
# genuinely differ:
#
#   1. the app is reached through a public tunnel hostname, not localhost, and
#      it has to know that hostname to emit correct absolute URLs;
#   2. the box is a 16GB VM, not a laptop that also runs a browser and an IDE —
#      the two containers that OOM at the dev limits get room here.
#
# runo substitutes ${RUNO_PUBLIC_URL} / ${RUNO_PUBLIC_HOST} at up time, after
# the tunnel exists and before the stack boots.
services:
    kodus-api:
        environment:
            - API_MCP_SERVER_ENABLED=true

    worker:
        environment:
            - API_MCP_SERVER_ENABLED=true

    mcp-manager:
        environment:
            - API_MCP_MANAGER_REDIRECT_URI=${RUNO_PUBLIC_URL}/setup/mcp/oauth
            - API_MCP_MANAGER_BACKEND_URL=http://kodus-api:3001

    web:
        environment:
            # .env ships NEXTAUTH_URL=http://localhost:3000, so without this
            # every visitor of the preview gets redirected to their own machine.
            - NEXTAUTH_URL=${RUNO_PUBLIC_URL}
            - AUTH_URL=${RUNO_PUBLIC_URL}
            # Next 16 answers 403 on /_next/* for dev requests coming from an
            # origin it was not told about — the tunnel hostname is one.
            - ALLOWED_DEV_ORIGINS=${RUNO_PUBLIC_HOST}
            # The billing proxy runs server-side inside this container, so it
            # must use Docker DNS rather than the browser's localhost.
            - WEB_HOSTNAME_BILLING=kodus-service-billing
            - WEB_PORT_BILLING=3992
        deploy:
            resources:
                limits:
                    # Turbopack dev compiling ~10 route slots at once gets
                    # OOM-killed at the dev limit of 4G on a cold preview.
                    memory: 8G

    webhooks:
        deploy:
            resources:
                limits:
                    # ts-node boot + migrations + seeds exceeds the 1G dev
                    # limit on a cold VM and the container crash-loops.
                    memory: 2G

    # Billing is a separate repository today. Runo checks it out during setup
    # and this overlay joins it to the same databases and networks as kodus-ai.
    # Only Stripe TEST credentials are accepted by the materialization script.
    kodus-service-billing:
        build:
            # Compose/BuildKit fetches this public repo directly. This keeps a
            # pre-existing Runo VM reconcilable too: it does not depend on a
            # one-time setup clone having run before `runo up`.
            context: https://github.com/kodustech/kodus-service-billing.git#main
            dockerfile: DockerFiles/Dockerfile.dev
        image: kodus-service-billing-preview:latest
        container_name: kodus-service-billing
        depends_on:
            db_postgres:
                condition: service_healthy
        env_file:
            - .env.billing
        ports:
            - '3992:3992'
        restart: unless-stopped
        networks:
            - kodus-backend-services
            - shared-network
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3992/health/ready').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 12
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 256M
