# Bound the per-container json log file size on EVERY host. OrbStack
# defaults to a sensible cap (max-size 20m, max-file 5), but vanilla
# Docker on Linux applies NO rotation by default — MongoDB's verbose
# stdout filled `/var/lib/docker/containers/<id>/<id>-json.log` to tens
# of GB on a teammate's machine and corrupted the partition before we
# noticed. Shipping the cap in compose makes the fix portable across
# Mac/Linux/CI without per-machine daemon.json edits.
x-logging: &default-logging
    driver: json-file
    options:
        max-size: '20m'
        max-file: '5'

x-app-service-template: &app-service-defaults
    build:
        context: .
        dockerfile: docker/Dockerfile.dev
        args:
            - API_CLOUD_MODE=${API_CLOUD_MODE:-false}
    image: kodus-ai-dev:latest
    env_file:
        # .env.local (per-dev overrides, gitignored) is loaded LAST so it
        # wins over the generated .env — same cascade the app uses at
        # runtime. Optional: absent for most devs.
        - path: ${ENV_FILE:-.env}
        - path: .env.local
          required: false
    environment:
        - CHOKIDAR_USEPOLLING=false
        - API_DEVELOPMENT_MODE=${API_DEVELOPMENT_MODE:-true}
        # pnpm 11 wants a TTY to confirm purging node_modules when manifests
        # change (e.g. after a branch switch). The dev-entrypoint runs
        # non-interactively, so CI=true lets pnpm skip the confirmation and
        # sync deps instead of aborting with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY.
        - CI=true
    restart: unless-stopped
    volumes:
        - .:/usr/src/app:delegated
        - node_modules_cache:/usr/src/app/node_modules
        - pnpm_store:/usr/src/app/.pnpm-store
        - logs_data:/usr/src/app/logs
    networks:
        - kodus-backend-services
        - shared-network
    logging: *default-logging

x-runtime-env: &runtime-env
    TS_NODE_PROJECT: apps/runtime/tsconfig.json
    TS_NODE_TRANSPILE_ONLY: 'true'
    # The Runtime's own least-privilege users (scripts/runtime/dev-runtime-users.sh
    # writes them to .runtime-certs/runtime-users.env; pass it as a second
    # --env-file). Without it the product admin credentials are the fallback.
    RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL:-postgres://${API_PG_DB_USERNAME}:${API_PG_DB_PASSWORD}@db_postgres:5432/kodus_runtime}
    RUNTIME_RABBITMQ_URL: ${RUNTIME_RABBITMQ_URL:-${API_RABBITMQ_URI}}
    # The Run stream: the hub writes it to the Runtime Postgres (runtime_run_events), which any
    # hub replica appends to and the API reads read-only. `file` keeps the shared volume below.
    RUNTIME_STREAM_STORE: ${RUNTIME_STREAM_STORE:-postgres}
    RUNTIME_STREAM_DIR: /data/runtime-streams
    # Evidence: `file` (the worker's volume and evidence server, one replica) or `s3` (a bucket;
    # `--profile evidence-s3` starts a MinIO for it). The keys default to the dev MinIO's (local only).
    RUNTIME_EVIDENCE_STORE: ${RUNTIME_EVIDENCE_STORE:-file}
    RUNTIME_EVIDENCE_S3_BUCKET: ${RUNTIME_EVIDENCE_S3_BUCKET:-kody-runtime-evidence}
    RUNTIME_EVIDENCE_S3_ENDPOINT: ${RUNTIME_EVIDENCE_S3_ENDPOINT:-http://runtime-minio:9000}
    RUNTIME_EVIDENCE_S3_PUBLIC_ENDPOINT: ${RUNTIME_EVIDENCE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    RUNTIME_EVIDENCE_S3_FORCE_PATH_STYLE: ${RUNTIME_EVIDENCE_S3_FORCE_PATH_STYLE:-true}
    RUNTIME_EVIDENCE_S3_ACCESS_KEY_ID: ${RUNTIME_EVIDENCE_S3_ACCESS_KEY_ID:-kody-runtime-dev}
    RUNTIME_EVIDENCE_S3_SECRET_ACCESS_KEY: ${RUNTIME_EVIDENCE_S3_SECRET_ACCESS_KEY:-dev-only-runtime-minio-secret-0000}
    # The hub's internal listener (worker → hub, private network only; never published).
    RUNTIME_HUB_INTERNAL_PORT: '3411'
    RUNTIME_HUB_URL: https://runtime-hub:3411
    DBOS_LOG_LEVEL: warn

x-runtime-service-template: &runtime-service-defaults
    image: node:22.23.4-slim
    working_dir: /usr/src/app
    volumes:
        - .:/usr/src/app:delegated
        - ${RUNTIME_NODE_MODULES:-./node_modules}:/usr/src/app/node_modules:ro
        - ${RUNTIME_CERTS_DIR:-./.runtime-certs}:/certs:ro
        - runtime_streams:/data/runtime-streams
    restart: unless-stopped
    # The hub and the worker create the kodus_runtime database on boot when it
    # is missing (apps/runtime/src/shared/persistence/runtime-schema.ts ensureDatabase).
    depends_on:
        db_postgres:
            condition: service_healthy
    networks:
        - kodus-backend-services
        - shared-network
    logging: *default-logging

services:
    #----------------------------------------------------------------
    # Application Services
    #----------------------------------------------------------------
    kodus-api:
        <<: *app-service-defaults
        container_name: kodus_api
        # An init reaps zombies: a restart never leaves one the daemon cannot kill.
        init: true
        depends_on:
            rabbitmq:
                condition: service_healthy
                # Optional so the compose file still validates when the
                # `local-db` profile is not active (e.g. pointing at an
                # external RabbitMQ). When the local rabbitmq IS running,
                # docker waits for its healthcheck before starting.
                required: false
            # This service runs `migration:run` on boot, and the migration set
            # includes four that write to Mongo. Waiting on the container's
            # START is not enough: a mongod that exits on startup leaves the
            # container flapping, docker's embedded DNS drops the name, and the
            # migration fails with `getaddrinfo ENOTFOUND db_kodus_mongodb` —
            # an error that accuses DNS for what is a dead database. Both
            # services publish a healthcheck; gate on it.
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        ports:
            # Host-side port vars (`<HOST>_PORT:-default`) let parallel
            # worktrees coexist by overriding to a per-slot offset (e.g.
            # `.env.local` in worktree B sets API_DEBUG_PORT=9329 etc).
            # Container-side ports stay fixed because each container has
            # its own network namespace.
            - '${API_PORT:-3001}:${API_PORT:-3001}'
            - '${API_DEBUG_PORT:-9229}:9229'
            - '${API_METRICS_PORT:-8000}:8000'
        command: pnpm run start:dev:api
        deploy:
            resources:
                limits:
                    # Dev mode with ts-node-dev + Sentry + observability
                    # + in-memory Nest DI graph routinely climbs past
                    # 1.5G under modest load; the 1.5G cap caused the
                    # container to OOM repeatedly mid-session, making
                    # every /api/proxy/* call 500 while migrations
                    # re-ran on the restart. Bumped to 3G with matching
                    # V8 heap ceiling so normal activity has headroom.
                    memory: 3G
                reservations:
                    memory: 512M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'node -e "const http=require(''http''); const port=process.env.API_PORT||3001; const req=http.get({host:''127.0.0.1'', port, path:''/health'', timeout:2000}, (res)=>process.exit(res.statusCode===200?0:1)); req.on(''error'', ()=>process.exit(1)); req.on(''timeout'', ()=>{ req.destroy(); process.exit(1); });"',
                ]
            interval: 20s
            timeout: 10s
            retries: 8
            start_period: 180s
        environment:
            # pnpm 11 aborts a non-interactive node_modules purge (branch
            # switch → manifest drift) without CI=true. Per-service blocks
            # override the anchor's environment list, so it must be set here.
            - CI=true
            - API_CLOUD_MODE=${API_CLOUD_MODE:-false}
            - NODE_OPTIONS=--max-old-space-size=2560 --max-semi-space-size=64
            - DEBUG_PORT=9229
            - API_LOG_PRETTY=true
            - CHOKIDAR_USEPOLLING=false
            - API_DEVELOPMENT_MODE=${API_DEVELOPMENT_MODE:-true}
            - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
            - RUN_SEEDS=${RUN_SEEDS:-true}
            - PYROSCOPE_SERVER_ADDRESS=${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
            - PYROSCOPE_HEAP_PROFILING=${PYROSCOPE_HEAP_PROFILING:-false}
            # Kody Runtime reads (runs stream, cells, egress) and the LLM
            # gateway's Run token. The dev secret is for local stacks only.
            - RUNTIME_DATABASE_URL=postgres://${API_PG_DB_USERNAME}:${API_PG_DB_PASSWORD}@db_postgres:5432/kodus_runtime
            # The API reads the Runtime database with this URL only (there is no
            # fallback to the read-write one). scripts/runtime/dev-runtime-users.sh
            # makes a read-only role; a dev stack without it reads as the owner.
            - RUNTIME_DATABASE_READ_URL=${RUNTIME_DATABASE_READ_URL:-postgres://${API_PG_DB_USERNAME}:${API_PG_DB_PASSWORD}@db_postgres:5432/kodus_runtime}
            # The Run stream from the Runtime Postgres with RUNTIME_DATABASE_READ_URL. The volume is
            # read only for a Run that has no row there (written before the switch to postgres).
            - RUNTIME_STREAM_STORE=${RUNTIME_STREAM_STORE:-postgres}
            - RUNTIME_STREAM_DIR=/data/runtime-streams
            # The Run cost prices a shared cell's held memory by its host (libs/runtime/api/domain/run-cost.ts):
            # cellId → instanceType (list price from CELL_HOST_LIST_PRICES) or usdPerHour. cell-dev-1 is a t4g.xlarge.
            - 'RUNTIME_CELL_PRICES=${RUNTIME_CELL_PRICES:-{"cell-dev-1":{"instanceType":"t4g.xlarge","region":"us-east-2"}}}'
            - RUNTIME_RUN_TOKEN_SECRET=${RUNTIME_RUN_TOKEN_SECRET:-dev-only-runtime-run-token-secret-0000}
            # The product seals the repo and Run tokens it hands the Runtime; the
            # runtime-worker opens them with the same key (dev-only value).
            - RUNTIME_SECRET_SEAL_KEY=${RUNTIME_SECRET_SEAL_KEY:-de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de70}
            - RUNTIME_ENABLED=${RUNTIME_ENABLED:-true}
            # /mcp/env (env_* tools): the runtime-worker's env-session listener, on
            # the compose network only (its HMAC signature is its only auth).
            - RUNTIME_ENV_SESSION_URL=${RUNTIME_ENV_SESSION_URL:-http://kodus_runtime_worker:3430}
            # Dev and e2e only: the product's Git calls for the Runtime answered from this file (refused in production).
            - RUNTIME_DEV_GIT_STUB_FILE=${RUNTIME_DEV_GIT_STUB_FILE:-}
            # GET /runtime/runs/:id/evidence/:stepId signs a 5-minute URL for the
            # evidence server of runtime-worker (its own origin, port 3420).
            - RUNTIME_EVIDENCE_BASE_URL=${RUNTIME_EVIDENCE_BASE_URL:-http://127.0.0.1:3420}
            - RUNTIME_EVIDENCE_SIGNING_SECRET=${RUNTIME_EVIDENCE_SIGNING_SECRET:-dev-only-runtime-evidence-signing-secret-000000}
            - RUNTIME_EVIDENCE_URL_TTL_SECONDS=300
            # RUNTIME_EVIDENCE_STORE=s3: presigned GETs of the bucket instead (a GetObject-only key is enough).
            - RUNTIME_EVIDENCE_STORE=${RUNTIME_EVIDENCE_STORE:-file}
            - RUNTIME_EVIDENCE_S3_BUCKET=${RUNTIME_EVIDENCE_S3_BUCKET:-kody-runtime-evidence}
            - RUNTIME_EVIDENCE_S3_ENDPOINT=${RUNTIME_EVIDENCE_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
            - RUNTIME_EVIDENCE_S3_FORCE_PATH_STYLE=${RUNTIME_EVIDENCE_S3_FORCE_PATH_STYLE:-true}
            - RUNTIME_EVIDENCE_S3_ACCESS_KEY_ID=${RUNTIME_EVIDENCE_S3_READ_ACCESS_KEY_ID:-${RUNTIME_EVIDENCE_S3_ACCESS_KEY_ID:-kody-runtime-dev}}
            - RUNTIME_EVIDENCE_S3_SECRET_ACCESS_KEY=${RUNTIME_EVIDENCE_S3_READ_SECRET_ACCESS_KEY:-${RUNTIME_EVIDENCE_S3_SECRET_ACCESS_KEY:-dev-only-runtime-minio-secret-0000}}
        volumes:
            - .:/usr/src/app:delegated
            - node_modules_cache:/usr/src/app/node_modules
            - pnpm_store:/usr/src/app/.pnpm-store
            - logs_data:/usr/src/app/logs
            - runtime_streams:/data/runtime-streams:ro

    worker:
        <<: *app-service-defaults
        container_name: kodus_worker
        # An init reaps zombies: a restart never leaves one the daemon cannot kill.
        init: true
        depends_on:
            rabbitmq:
                condition: service_healthy
                # Optional so the compose file still validates when the
                # `local-db` profile is not active (e.g. pointing at an
                # external RabbitMQ). When the local rabbitmq IS running,
                # docker waits for its healthcheck before starting.
                required: false
            # Runtime reads and writes Mongo. `required: false` above applies
            # to rabbitmq only: these two always run, and gating on their
            # healthcheck keeps a dead database from being discovered later as
            # a name that no longer resolves.
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        volumes:
            - .:/usr/src/app:delegated
            - node_modules_cache:/usr/src/app/node_modules:nocopy
            - pnpm_store:/usr/src/app/.pnpm-store
            - logs_data:/usr/src/app/logs
        ports:
            # See kodus-api comment on host-side port parametrization for
            # worktree coexistence.
            - '${API_WORKER_DEBUG_PORT:-9231}:9231'
            - '${API_WORKER_METRICS_PORT:-8001}:8001'
        command: pnpm run start:dev:worker
        deploy:
            resources:
                limits:
                    memory: 2G
                reservations:
                    memory: 512M
        healthcheck:
            # Asks the worker's own health probe (apps/worker/src/
            # health-probe.ts, WORKER_HEALTH_PORT, 3334 by default): 503
            # while RabbitMQ is disconnected, a consumer is missing or the
            # outbox relay is dead, connection refused while the app is not
            # running. A process check cannot tell any of that: the command
            # here is `nest build worker --watch`, and that watcher (with
            # RunScriptWebpackPlugin autoRestart: false) outlives an app
            # that exited at boot. start_period covers a cold webpack build.
            test:
                [
                    'CMD-SHELL',
                    'node -e "const http=require(''http''); const port=process.env.WORKER_HEALTH_PORT||3334; const req=http.get({host:''127.0.0.1'', port, path:''/health'', timeout:2000}, (res)=>process.exit(res.statusCode===200?0:1)); req.on(''error'', ()=>process.exit(1)); req.on(''timeout'', ()=>{ req.destroy(); process.exit(1); });"',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 180s
        environment:
            # pnpm 11 aborts a non-interactive node_modules purge (branch
            # switch → manifest drift) without CI=true. Per-service blocks
            # override the anchor's environment list, so it must be set here.
            - CI=true
            - API_CLOUD_MODE=${API_CLOUD_MODE:-false}
            # V8 heap kept below the 2G container cap (with ~500M headroom
            # for native modules, thread stacks, and Node runtime overhead).
            # Previously set to 4096M, which let V8 try to grow past the
            # cgroup limit — kernel OOM-killed the process silently while
            # the trivial healthcheck kept reporting "healthy".
            - NODE_OPTIONS=--max-old-space-size=1536 --max-semi-space-size=64
            - DEBUG_PORT=9231
            - COMPONENT_TYPE=worker
            - API_LOG_PRETTY=true
            - PYROSCOPE_SERVER_ADDRESS=${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
            - PYROSCOPE_HEAP_PROFILING=${PYROSCOPE_HEAP_PROFILING:-false}
            - WORKER_ROLE=code-review
            # Kody Runtime: the PR trigger signs the Run token and seals it and the
            # repo token for the runtime-worker (dev-only values, as on kodus-api).
            - RUNTIME_ENABLED=${RUNTIME_ENABLED:-true}
            - RUNTIME_RUN_TOKEN_SECRET=${RUNTIME_RUN_TOKEN_SECRET:-dev-only-runtime-run-token-secret-0000}
            - RUNTIME_SECRET_SEAL_KEY=${RUNTIME_SECRET_SEAL_KEY:-de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de70}
            # The PR trigger and the external-findings maintenance read the Run projection
            # (runtime.runtime_runs) read-only, as kodus-api does.
            - RUNTIME_DATABASE_READ_URL=${RUNTIME_DATABASE_READ_URL:-postgres://${API_PG_DB_USERNAME}:${API_PG_DB_PASSWORD}@db_postgres:5432/kodus_runtime}

    # Deep scan worker (#2451) — only the security-scan queue, so a scan's
    # long model loops never share a process with reviews. Cloud-only
    # feature: opt-in here, like analytics. Bring it up with
    # `KODUS_DEV_EXTRAS=security-scan pnpm run docker:start` (or `=extras`).
    worker-security-scan:
        <<: *app-service-defaults
        container_name: kodus_security_scan_worker
        profiles:
            - security-scan
            - extras
        depends_on:
            rabbitmq:
                condition: service_healthy
                required: false
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        volumes:
            - .:/usr/src/app:delegated
            - node_modules_cache:/usr/src/app/node_modules:nocopy
            - pnpm_store:/usr/src/app/.pnpm-store
            - logs_data:/usr/src/app/logs
        ports:
            # Same image as the code-review worker; host ports offset so all
            # workers can run side by side.
            - '${API_WORKER_SECURITY_SCAN_DEBUG_PORT:-9251}:9251'
            - '${API_WORKER_SECURITY_SCAN_METRICS_PORT:-8021}:8001'
        command: pnpm run start:dev:worker
        deploy:
            resources:
                limits:
                    memory: 2G
                reservations:
                    memory: 256M
        healthcheck:
            test: ['CMD-SHELL', 'pgrep -f "nest start worker" >/dev/null']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        environment:
            - CI=true
            - API_CLOUD_MODE=${API_CLOUD_MODE:-false}
            - NODE_OPTIONS=--max-old-space-size=1536 --max-semi-space-size=64
            - DEBUG_PORT=9251
            - COMPONENT_TYPE=worker
            - API_LOG_PRETTY=true
            - WORKER_ROLE=security-scan

    # Analytics-only worker — isolates the cockpit ingestion cron from
    # the code review event loop / pools. Runs in both cloud and
    # self-hosted so the topology stays identical across environments
    # (same pipeline, same bugs, same fixes — see issue #951).
    worker-analytics:
        <<: *app-service-defaults
        container_name: kodus_analytics_worker
        # Opt-in. Default `pnpm run docker:start` leaves this off — the cockpit
        # ingestion cron isn't useful for most dev flows and costs ~700 MiB
        # idle (Nest DI + ts-node-dev watch). Bring it up explicitly via
        # `KODUS_DEV_EXTRAS=analytics pnpm run docker:start` (or `=extras` for
        # all opt-in services).
        profiles:
            - analytics
            - extras
        depends_on:
            rabbitmq:
                condition: service_healthy
                required: false
            # Runtime reads and writes Mongo. `required: false` above applies
            # to rabbitmq only: these two always run, and gating on their
            # healthcheck keeps a dead database from being discovered later as
            # a name that no longer resolves.
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        volumes:
            - .:/usr/src/app:delegated
            - node_modules_cache:/usr/src/app/node_modules:nocopy
            - pnpm_store:/usr/src/app/.pnpm-store
            - logs_data:/usr/src/app/logs
        ports:
            # See kodus-api comment on host-side port parametrization for
            # worktree coexistence. Container side is 8001 (same as the
            # code-review worker — they're the same image; only WORKER_ROLE
            # differs); host side is offset to 8011 so both workers can
            # publish metrics in parallel.
            - '${API_WORKER_ANALYTICS_DEBUG_PORT:-9241}:9241'
            - '${API_WORKER_ANALYTICS_METRICS_PORT:-8011}:8001'
        command: pnpm run start:dev:worker
        deploy:
            resources:
                limits:
                    # Bumped from 1G after a smoke test on the heap-fixed
                    # config showed steady-state RSS around 900MiB (~90%
                    # of a 1G cap) — too tight for the cron-driven
                    # analytics ingestion pipeline to absorb spikes.
                    # Heap remains capped at 768M (see env block below);
                    # the extra 0.5G is headroom for native modules,
                    # thread stacks, and ingestion buffers.
                    memory: 1.5G
                reservations:
                    memory: 256M
        healthcheck:
            # Same probe as the worker service (see there). The analytics
            # role answers 200 while the app runs: it has no consumers and
            # no outbox relay to check.
            test:
                [
                    'CMD-SHELL',
                    'node -e "const http=require(''http''); const port=process.env.WORKER_HEALTH_PORT||3334; const req=http.get({host:''127.0.0.1'', port, path:''/health'', timeout:2000}, (res)=>process.exit(res.statusCode===200?0:1)); req.on(''error'', ()=>process.exit(1)); req.on(''timeout'', ()=>{ req.destroy(); process.exit(1); });"',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        environment:
            # pnpm 11 aborts a non-interactive node_modules purge (branch
            # switch → manifest drift) without CI=true. Per-service blocks
            # override the anchor's environment list, so it must be set here.
            - CI=true
            - API_CLOUD_MODE=${API_CLOUD_MODE:-false}
            # V8 heap kept below the 1G container cap. 1536M heap on a
            # 1G cgroup let V8 grow past the limit and triggered silent
            # OOM kills — see worker service comment.
            - NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=64
            - DEBUG_PORT=9241
            - COMPONENT_TYPE=worker
            - API_LOG_PRETTY=true
            - WORKER_ROLE=analytics
            - ANALYTICS_INGESTION_CRON=${ANALYTICS_INGESTION_CRON:-}
            - ANALYTICS_CLASSIFIER_CRON=${ANALYTICS_CLASSIFIER_CRON:-}
            - ANALYTICS_CLASSIFIER_DISABLED=${ANALYTICS_CLASSIFIER_DISABLED:-}
            - PYROSCOPE_SERVER_ADDRESS=${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
            - PYROSCOPE_HEAP_PROFILING=${PYROSCOPE_HEAP_PROFILING:-false}

    webhooks:
        <<: *app-service-defaults
        container_name: kodus_webhooks
        # An init reaps zombies: a restart never leaves one the daemon cannot kill.
        init: true
        depends_on:
            rabbitmq:
                condition: service_healthy
                # Optional so the compose file still validates when the
                # `local-db` profile is not active (e.g. pointing at an
                # external RabbitMQ). When the local rabbitmq IS running,
                # docker waits for its healthcheck before starting.
                required: false
            # Runtime reads and writes Mongo. `required: false` above applies
            # to rabbitmq only: these two always run, and gating on their
            # healthcheck keeps a dead database from being discovered later as
            # a name that no longer resolves.
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
        volumes:
            - .:/usr/src/app:delegated
            - node_modules_cache:/usr/src/app/node_modules:nocopy
            - pnpm_store:/usr/src/app/.pnpm-store
            - logs_data:/usr/src/app/logs
        ports:
            # See kodus-api comment on host-side port parametrization for
            # worktree coexistence.
            - '${API_WEBHOOKS_PORT:-3332}:${API_WEBHOOKS_PORT:-3332}'
            - '${API_WEBHOOKS_DEBUG_PORT:-9232}:9232'
            - '${API_WEBHOOKS_METRICS_PORT:-8002}:8002'
        command: pnpm run start:dev:webhooks
        deploy:
            resources:
                limits:
                    # 2G: `nest build webhooks --watch` (webpack) on top of the
                    # startup migrations was OOM-killed at 1G (exit 137) on a
                    # remote dev VM — twice — and a dead webhooks service means
                    # no PR review ever starts, which looks like a product bug.
                    memory: 2G
                reservations:
                    memory: 256M
        healthcheck:
            # Asks the app's own readiness route (apps/webhooks/src/
            # controllers/webhook-health.controller.ts): 503 while Postgres,
            # where every webhook is persisted to the outbox, does not answer;
            # 200 "degraded" while only RabbitMQ is down, since the worker's
            # relay publishes once it is back; connection refused while the
            # app is not running. The process check it replaces could not
            # tell any of that: its pattern ("nest start webhooks") is not the
            # command here (`nest build webhooks --watch`), and `pgrep -f`
            # matches its own `sh -c` parent. start_period covers a cold
            # webpack build, as for the worker.
            test:
                [
                    'CMD-SHELL',
                    'node -e "const http=require(''http''); const port=process.env.API_WEBHOOKS_PORT||3332; const req=http.get({host:''127.0.0.1'', port, path:''/health'', timeout:5000}, (res)=>process.exit(res.statusCode===200?0:1)); req.on(''error'', ()=>process.exit(1)); req.on(''timeout'', ()=>{ req.destroy(); process.exit(1); });"',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 180s
        environment:
            # pnpm 11 aborts a non-interactive node_modules purge (branch
            # switch → manifest drift) without CI=true. Per-service blocks
            # override the anchor's environment list, so it must be set here.
            - CI=true
            - API_CLOUD_MODE=${API_CLOUD_MODE:-false}
            # V8 heap kept below the 1G container cap. 4096M heap on a
            # 1G cgroup let V8 grow past the limit and triggered silent
            # OOM kills — see worker service comment.
            - NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=64
            - DEBUG_PORT=9232
            - API_LOG_PRETTY=true
            # Webhooks never publish (the outbox relay in the worker does), so
            # they boot without the broker (rabbitmq-connection-init.policy).
            # Pinned here because the .env template sets API_RABBITMQ_WAIT=true,
            # which would bring back the 5 s fail-fast.
            - API_RABBITMQ_WAIT=false
            - PYROSCOPE_SERVER_ADDRESS=${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
            - PYROSCOPE_HEAP_PROFILING=${PYROSCOPE_HEAP_PROFILING:-false}

    mcp-manager:
        <<: *app-service-defaults
        image: kodus-ai-mcp-manager:latest
        container_name: kodus-mcp-manager
        # Opt-in. Default `pnpm run docker:start` leaves this off — the web UI
        # degrades gracefully (MCP setup/plugins pages show empty state).
        # Bring it up via `KODUS_DEV_EXTRAS=mcp pnpm run docker:start` (or
        # `=extras` for all opt-in services).
        profiles:
            - mcp
            - extras
        ports:
            # See kodus-api comment on host-side port parametrization for
            # worktree coexistence.
            - '${API_MCP_MANAGER_PORT:-3101}:${API_MCP_MANAGER_PORT:-3101}'
            - '${API_MCP_MANAGER_DEBUG_PORT:-9230}:9230'
        # mcp-manager owns its own schema. ensure-schema + migration
        # run inline before the dev server boots (see fix(mcp-manager):
        # isolate migration ownership from API entrypoint). The api
        # service's dev-entrypoint.sh no longer touches it.
        command: sh -c 'pnpm run mcp-manager:ensure-schema && pnpm run mcp-manager:migration:run:internal && pnpm run start:dev:mcp-manager'
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 256M
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'node -e "const http=require(''http''); const port=process.env.API_MCP_MANAGER_PORT||3101; const req=http.get({host:''127.0.0.1'', port, path:''/health'', timeout:2000}, (res)=>process.exit(res.statusCode===200?0:1)); req.on(''error'', ()=>process.exit(1)); req.on(''timeout'', ()=>{ req.destroy(); process.exit(1); });"',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        environment:
            # mcp-manager always runs its own ensure-schema + migration
            # via the `command:` above (and via prod-entrypoint-mcp-manager
            # in prod). We force RUN_MIGRATIONS=false here so the shared
            # dev-entrypoint.sh doesn't ALSO run the API/analytics
            # migrations from inside this container — those belong to the
            # api/worker services, not here.
            - RUN_MIGRATIONS=false
            # V8 heap kept below the 1G container cap with headroom for
            # native modules and runtime overhead.
            - NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=64
            - DEBUG_PORT=9230
            - API_MCP_MANAGER_PORT=${API_MCP_MANAGER_PORT:-3101}
            - API_MCP_MANAGER_LOG_LEVEL=${API_MCP_MANAGER_LOG_LEVEL:-info}
            - API_MCP_MANAGER_NODE_ENV=${API_MCP_MANAGER_NODE_ENV:-development}
            - API_MCP_MANAGER_DATABASE_ENV=${API_MCP_MANAGER_DATABASE_ENV:-development}
            - API_MCP_MANAGER_CORS_ORIGINS=${API_MCP_MANAGER_CORS_ORIGINS:-*}
            - API_MCP_MANAGER_JWT_SECRET=${API_MCP_MANAGER_JWT_SECRET:-}
            # Secret used to VERIFY the orchestrator access tokens the web app
            # forwards here. Must match the API's
            # API_JWT_SECRET or MCP requests fail auth.
            - API_JWT_SECRET=${API_JWT_SECRET:-}
            - API_MCP_MANAGER_ENCRYPTION_SECRET=${API_MCP_MANAGER_ENCRYPTION_SECRET:-}
            - API_MCP_MANAGER_PG_DB_SCHEMA=${API_MCP_MANAGER_PG_DB_SCHEMA:-mcp-manager}
            - API_MCP_MANAGER_MCP_PROVIDERS=${API_MCP_MANAGER_MCP_PROVIDERS:-kodusmcp,custom}
            - API_MCP_MANAGER_REDIRECT_URI=${API_MCP_MANAGER_REDIRECT_URI:-http://localhost:3000/setup/mcp/oauth}

    #----------------------------------------------------------------
    # Web Frontend
    #----------------------------------------------------------------
    web:
        build:
            context: ./apps/web
            dockerfile: ../../docker/Dockerfile.web.dev
        container_name: kodus_web
        # An init reaps zombies: a restart never leaves one the daemon cannot kill.
        init: true
        depends_on:
            kodus-api:
                condition: service_healthy
        ports:
            - '${WEB_PORT:-3000}:3000'
        env_file:
            # See kodus-api: .env.local is the per-dev override layer.
            - path: ${ENV_FILE:-.env}
            - path: .env.local
              required: false
        volumes:
            - ./apps/web:/usr/src/app:delegated
            # Mount shared monorepo libs at the location apps/web's
            # tsconfig path `@libs/*` (= "../../libs/*" relative to
            # apps/web baseUrl) resolves to inside the container —
            # `/usr/src/app/../../libs/` = `/usr/libs/`. Without this,
            # web server components that import from `@libs/feature-gate`
            # fail with "module not found" because the libs/ directory
            # only lives on the host bind-mount of `apps/web`.
            - ./libs:/usr/libs:delegated
            - web_node_modules_cache:/usr/src/app/node_modules
            - web_next_cache:/usr/src/app/.next
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        networks:
            - kodus-backend-services
            - shared-network
        environment:
            - CHOKIDAR_USEPOLLING=false
            - NODE_ENV=development
            - NEXT_TELEMETRY_DISABLED=1
            # `next dev` answers 403 on /_next/* to an origin it was not told
            # about (apps/web/next.config.js allowedDevOrigins). A stack opened
            # by its IP or a public host, as the self-hosted Runo recipe does
            # (.kodus/workspace.selfhosted.yaml), never hydrates without it:
            # the sign-up form renders and does nothing. Read from the shell
            # or the compose environment (the recipe's services.compose.env);
            # unset, the container has none.
            - ALLOWED_DEV_ORIGINS
        deploy:
            resources:
                limits:
                    memory: 4G
                reservations:
                    memory: 512M
        logging: *default-logging

    try:
        # Public PR review demo (try.kodus.io). Opt-in — the default
        # `pnpm run docker:start` skips it because most backend flows don't
        # need the marketing-facing surface running. Bring it up with
        # `docker compose -f docker-compose.dev.yml --profile demo up try`
        # or include it in the `extras` umbrella for everything-at-once.
        profiles:
            - demo
            - extras
        build:
            context: ./apps/try
            dockerfile: ../../docker/Dockerfile.try.dev
        container_name: kodus_try
        depends_on:
            kodus-api:
                condition: service_healthy
        ports:
            - '${TRY_PORT:-3002}:3002'
        env_file:
            # See kodus-api: .env.local is the per-dev override layer.
            - path: ${ENV_FILE:-.env}
            - path: .env.local
              required: false
        volumes:
            - ./apps/try:/usr/src/app:delegated
            - try_node_modules_cache:/usr/src/app/node_modules
            - try_next_cache:/usr/src/app/.next
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:3002/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        networks:
            - kodus-backend-services
            - shared-network
        environment:
            - CHOKIDAR_USEPOLLING=false
            - NODE_ENV=development
            - NEXT_TELEMETRY_DISABLED=1
            # Inside the compose network the API is reachable as
            # `kodus-api`, but the browser running outside the network
            # hits the public host port instead. NEXT_PUBLIC_* is baked
            # into the client bundle at build time / read in the browser,
            # so the host-side URL is the correct choice.
            - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 256M
        logging: *default-logging

    #----------------------------------------------------------------
    # Observability & Profiling
    #----------------------------------------------------------------
    pyroscope:
        # `profiling` is the historic, explicit profile (activated by
        # `ENABLE_PROFILING=true` or `pnpm run docker:start:profiling`).
        # `extras` is the new umbrella alongside mcp-manager and
        # worker-analytics — `pnpm run docker:start:full` brings everything
        # up in one command.
        profiles:
            - profiling
            - extras
            - infra
        image: docker.io/grafana/pyroscope:latest
        container_name: pyroscope
        ports:
            - '4040:4040'
        volumes:
            - pyroscope-data:/var/lib/pyroscope
        networks:
            - kodus-backend-services
        restart: unless-stopped
        logging: *default-logging

    #----------------------------------------------------------------
    # Kody Runtime control plane (apps/runtime). Same broker and Postgres
    # server as the product; the Runtime keeps everything in its own
    # database (kodus_runtime, ADR-025) and uses no Mongo. mTLS with the dev CA:
    #   scripts/runtime/dev-ca.sh .runtime-certs cell-dev-1
    # The Go cell runs on the host (apps/runtime-cell, local-docker driver)
    # and dials wss://127.0.0.1:${RUNTIME_HUB_PORT:-3410}/cells.
    # Plain node image + the host's node_modules read-only (pure-JS deps),
    # so these services never run pnpm install on the shared volume.
    # docker-compose.runtime.yml stays the isolated stack for tests.
    # Off unless the `runtime` profile is on, since they need the certificates
    # above: `KODUS_DEV_EXTRAS=runtime pnpm run docker:start`, or
    # `docker compose -f docker-compose.dev.yml --profile runtime up -d`.
    # A down without the profile leaves them running: add `--profile runtime`.
    #----------------------------------------------------------------
    runtime-hub:
        <<: *runtime-service-defaults
        container_name: kodus_runtime_hub
        profiles: ['runtime']
        # An init reaps zombies: a restart never leaves one the daemon cannot kill.
        init: true
        command: sh -c 'set -a && . /certs/container.env && set +a && exec node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/runtime/src/hub/main.ts'
        environment:
            <<: *runtime-env
            RUNTIME_REPLICA_ID: hub-dev-1
            # What the worker dials for this replica: its internal listener.
            RUNTIME_REPLICA_URL: https://runtime-hub:3411
            RUNTIME_METRICS_PORT: '9464'
            # local-docker cells run with isolation none (dev only).
            RUNTIME_DEV_ALLOW_INSECURE_CELLS: '1'
            # The org secrets' references (id, name, hosts) from the product database, as the
            # role that may read only those (dev-runtime-users.sh). Unset: claims get no secrets.
            RUNTIME_PRODUCT_SECRETS_READ_URL: ${RUNTIME_PRODUCT_SECRETS_READ_URL:-}
            # The preview edge's tunnel endpoint (profile preview); empty: no preview is routed.
            RUNTIME_PREVIEW_TUNNEL_URL: ${RUNTIME_PREVIEW_TUNNEL_URL:-}
        ports:
            - '127.0.0.1:${RUNTIME_HUB_PORT:-3410}:3410'
            - '127.0.0.1:${RUNTIME_HUB_METRICS_PORT:-9464}:9464'

    # Preview URLs (docs/runtime/preview-urls.md), off unless started with
    # `docker compose --profile preview`. scripts/runtime/dev-ca.sh writes its
    # certificates and preview.env (domain kodus-preview.localhost: Chrome
    # resolves *.localhost to the loopback). For a preview to open, the hub
    # needs RUNTIME_PREVIEW_TUNNEL_URL=wss://runtime-preview-edge:3431/v1/cells/tunnel,
    # the worker RUNTIME_PREVIEW_DOMAIN, the API RUNTIME_PREVIEW_GRANT_PRIVATE_KEY
    # (`openssl pkey -in preview-grant.key -outform DER | base64`; RUNTIME_PREVIEW_PUBLIC_PORT=3430
    # for the local port) and the cell -preview.
    runtime-preview-edge:
        <<: *runtime-service-defaults
        container_name: kodus_runtime_preview_edge
        profiles: ['preview']
        init: true
        command: sh -c 'set -a && . /certs/container.env && . /certs/preview.env && set +a && exec node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/runtime/src/edge/main.ts'
        environment:
            <<: *runtime-env
            RUNTIME_REPLICA_ID: edge-dev-1
            RUNTIME_PREVIEW_APP_URL: ${WEB_HOSTNAME_URL:-http://localhost:3000}
            RUNTIME_PREVIEW_EDGE_PORT: '3430'
            RUNTIME_PREVIEW_TUNNEL_PORT: '3431'
        ports:
            - '127.0.0.1:${RUNTIME_PREVIEW_EDGE_PORT:-3430}:3430'
            - '127.0.0.1:${RUNTIME_PREVIEW_TUNNEL_PORT:-3431}:3431'

    runtime-worker:
        <<: *runtime-service-defaults
        container_name: kodus_runtime_worker
        profiles: ['runtime']
        # An init reaps zombies: a restart never leaves one the daemon cannot kill.
        init: true
        command: sh -c 'set -a && . /certs/container.env && set +a && exec node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/runtime/src/worker/main.ts'
        environment:
            <<: *runtime-env
            RUNTIME_RELEASE_VERSION: ${RUNTIME_RELEASE_VERSION-development}
            RUNTIME_ENV_DRIVER: hub
            RUNTIME_METRICS_PORT: '9465'
            # Previews are off until the preview domain is set (decision 1).
            RUNTIME_PREVIEW_DOMAIN: ${RUNTIME_PREVIEW_DOMAIN:-}
            # Opens the repo and Run tokens the product sends sealed (AES-256-GCM, bound to the Run
            # or the setup key). The dev-only key is for local stacks only; the product must seal with
            # the same one (RUNTIME_SECRET_SEAL_KEY on kodus-api and worker).
            RUNTIME_SECRET_SEAL_KEY: ${RUNTIME_SECRET_SEAL_KEY:-de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de70}
            RUNTIME_ORG_CONCURRENCY: '2'
            # Environment setups of one org that run at once (1..8); the rest wait their turn.
            RUNTIME_SETUP_PER_ORG: ${RUNTIME_SETUP_PER_ORG:-2}
            # 1 (default): each Run side is kept as a round snapshot at its first ready and resets
            # restore it, on cells that keep snapshots (firecracker); others reset compose volumes. 0: off.
            RUNTIME_ROUND_SNAPSHOTS: ${RUNTIME_ROUND_SNAPSHOTS:-1}
            # Share (0..100) of the measured changed lines the PR side must run for a green Run to stay green.
            RUNTIME_EXERCISED_LINES_THRESHOLD_PERCENT: ${RUNTIME_EXERCISED_LINES_THRESHOLD_PERCENT:-50}
            # The product LLM gateway (POST /internal/runtime/llm, org BYOK).
            # Unset = the dev API. Set it empty for recorded responses
            # (RUNTIME_LLM_FIXTURE or the shop fixture), as run-e2e.sh does.
            RUNTIME_LLM_GATEWAY_URL: ${RUNTIME_LLM_GATEWAY_URL-http://kodus_api:3001}
            RUNTIME_LLM_FIXTURE: ${RUNTIME_LLM_FIXTURE:-}
            # The Git API the cell downloads tarballs from; must equal the cell's -git-api.
            RUNTIME_GIT_API_BASE: ${RUNTIME_GIT_API_BASE:-https://api.github.com}
            # Setup (runtime.environment.setup_requested): the API sends the
            # default-branch head, the recipe at that commit and a download token.
            # Explicit dev overrides only (the worker warns at boot): a commit to
            # boot instead of the product's, an expose list over the recipe's,
            # and the ready path when the recipe has no services.compose.health.
            RUNTIME_SETUP_DEV_SHA: ${RUNTIME_SETUP_DEV_SHA:-}
            RUNTIME_SETUP_EXPOSE: ${RUNTIME_SETUP_EXPOSE:-}
            RUNTIME_SETUP_HEALTH_PATH: ${RUNTIME_SETUP_HEALTH_PATH:-}
            # How many times one setup sends a failed boot of Kody's recipe back
            # to Kody and boots the rewrite (default 2, 0 turns it off).
            RUNTIME_SETUP_AUTHOR_REPAIRS: ${RUNTIME_SETUP_AUTHOR_REPAIRS:-2}
            # Evidence (§8): the observer output of every replay round on a local
            # volume, 30 days, served on its own port only for URLs the API signed.
            RUNTIME_EVIDENCE_DIR: /data/runtime-evidence
            RUNTIME_EVIDENCE_PORT: '3420'
            RUNTIME_EVIDENCE_SIGNING_SECRET: ${RUNTIME_EVIDENCE_SIGNING_SECRET:-dev-only-runtime-evidence-signing-secret-000000}
            # Where a cell PUTs a round's screenshots, videos and logs with the
            # worker's grants: this evidence server as the cell reaches it. A
            # cell on this machine reaches the published port; a remote cell
            # needs `ssh -R 127.0.0.1:3420:localhost:3420`. Empty: "not captured".
            RUNTIME_EVIDENCE_UPLOAD_URL: ${RUNTIME_EVIDENCE_UPLOAD_URL:-http://localhost:3420}
            # The env-session listener the API's /mcp/env tools call; not published on the host.
            RUNTIME_ENV_SESSION_PORT: '3430'
        volumes:
            - .:/usr/src/app:delegated
            - ${RUNTIME_NODE_MODULES:-./node_modules}:/usr/src/app/node_modules:ro
            - ${RUNTIME_CERTS_DIR:-./.runtime-certs}:/certs:ro
            # No runtime_streams: the worker hands Run events to the hub, which writes the stream.
            - runtime_evidence:/data/runtime-evidence
        ports:
            - '127.0.0.1:${RUNTIME_WORKER_METRICS_PORT:-9465}:9465'
            - '127.0.0.1:${RUNTIME_EVIDENCE_PORT:-3420}:3420'
        depends_on:
            db_postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
                required: false
            runtime-hub:
                condition: service_started

    # Optional S3-compatible evidence store (RUNTIME_EVIDENCE_STORE=s3), off by default:
    #   docker compose -f docker-compose.dev.yml --profile evidence-s3 up -d runtime-minio runtime-minio-init
    # then RUNTIME_EVIDENCE_STORE=s3 for runtime-worker and kodus-api. Dev-only keys, bound to 127.0.0.1.
    # The init creates the bucket and its lifecycle rule (30 days; 1 day for the staging prefix).
    # The upstream minio/minio image is no longer on Docker Hub; this is Bitnami's last build.
    runtime-minio:
        image: bitnamilegacy/minio:2025.7.23
        container_name: kodus_runtime_minio
        profiles:
            - evidence-s3
        environment:
            MINIO_ROOT_USER: ${RUNTIME_EVIDENCE_S3_ACCESS_KEY_ID:-kody-runtime-dev}
            MINIO_ROOT_PASSWORD: ${RUNTIME_EVIDENCE_S3_SECRET_ACCESS_KEY:-dev-only-runtime-minio-secret-0000}
        ports:
            # Cells on this machine and the browser reach it here (RUNTIME_EVIDENCE_S3_PUBLIC_ENDPOINT).
            - '127.0.0.1:${RUNTIME_MINIO_PORT:-9000}:9000'
        volumes:
            - runtime_minio:/bitnami/minio/data
        healthcheck:
            test: ['CMD', 'curl', '-sf', 'http://localhost:9000/minio/health/live']
            interval: 3s
            retries: 30
        networks:
            - kodus-backend-services

    runtime-minio-init:
        <<: *runtime-service-defaults
        container_name: kodus_runtime_minio_init
        profiles:
            - evidence-s3
        restart: 'no'
        command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/runtime/src/e2e/evidence-bucket.ts
        environment:
            <<: *runtime-env
        depends_on:
            runtime-minio:
                condition: service_healthy

    # The Runtime's secret store (docs/runtime/sandbox.md "Secrets: OpenBao"), off by default:
    #   scripts/runtime/dev-openbao.sh   (once: TLS, unseal key, AppRole ids, Postgres password)
    #   RUNTIME_OPENBAO_UID=$(id -u) docker compose -f docker-compose.dev.yml --profile runtime-secrets up -d runtime-openbao
    # then add .runtime-certs/openbao/api.env to the API's env. Storage is the dev Postgres, database
    # kodus_openbao with its own role; static-key auto-unseal; self-initialized on the first start (KV v2
    # at runtime-kv, the API and injector policies and AppRoles). No root token survives the init.
    # Unmodified upstream image (MPL-2.0), pinned by digest.
    runtime-openbao-db:
        image: docker.io/pgvector/pgvector:pg16
        container_name: kodus_runtime_openbao_db
        profiles:
            - runtime-secrets
        restart: 'no'
        environment:
            PGPASSWORD: ${API_PG_DB_PASSWORD}
            API_PG_DB_USERNAME: ${API_PG_DB_USERNAME}
            API_PG_DB_DATABASE: ${API_PG_DB_DATABASE}
        volumes:
            - ${RUNTIME_CERTS_DIR:-./.runtime-certs}/openbao:/openbao/secrets:ro
            - ./docker/openbao/create-database.sql:/openbao/create-database.sql:ro
        command:
            - sh
            - -ec
            - psql -h db_postgres -U "$$API_PG_DB_USERNAME" -d "$$API_PG_DB_DATABASE" -v ON_ERROR_STOP=1 -v pw="$$(cat /openbao/secrets/pg-password)" -f /openbao/create-database.sql
        depends_on:
            db_postgres:
                condition: service_healthy
        networks:
            - kodus-backend-services

    runtime-openbao:
        image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
        container_name: kodus_runtime_openbao
        profiles:
            - runtime-secrets
        # The host user, so it reads the 0600 files dev-openbao.sh wrote.
        user: '${RUNTIME_OPENBAO_UID:-1000}:${RUNTIME_OPENBAO_GID:-0}'
        entrypoint: ['bao']
        command: ['server', '-config=/openbao/config']
        cap_add:
            - IPC_LOCK
        environment:
            PGHOST: db_postgres
            PGPORT: '5432'
            PGDATABASE: kodus_openbao
            PGUSER: openbao
            PGSSLMODE: disable
            PGPASSFILE: /openbao/secrets/pgpass
        volumes:
            - ./docker/openbao/config:/openbao/config:ro
            - ./docker/openbao/policies:/openbao/policies:ro
            - ${RUNTIME_CERTS_DIR:-./.runtime-certs}/openbao:/openbao/secrets:ro
        ports:
            # Cells on this machine reach it here (the injector's -openbao-addr).
            - '127.0.0.1:${RUNTIME_OPENBAO_PORT:-8200}:8200'
        restart: unless-stopped
        healthcheck:
            # 200 only when active and unsealed.
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', '--no-check-certificate', 'https://127.0.0.1:8200/v1/sys/health']
            interval: 5s
            timeout: 3s
            retries: 24
        depends_on:
            runtime-openbao-db:
                condition: service_completed_successfully
        networks:
            - kodus-backend-services
        logging: *default-logging

    #----------------------------------------------------------------
    # Databases & Infrastructure
    #----------------------------------------------------------------
    rabbitmq:
        build:
            context: ./docker/rabbitMQ
            dockerfile: Dockerfile
        container_name: rabbitmq
        hostname: ${RABBITMQ_HOSTNAME:-rabbitmq-local}
        ports:
            - '5672:5672'
            - '15672:15672'
            - '15692:15692'
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-dev}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-devpass}
            - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME:-rabbitmq}
            - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 1000000000 -rabbit heartbeat 60
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        restart: unless-stopped
        networks:
            kodus-backend-services:
                aliases:
                    - rabbitmq-local
                    - rabbitmq
            shared-network:
                aliases:
                    - rabbitmq-local
                    - rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
            interval: 30s
            timeout: 10s
            retries: 5
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        logging: *default-logging

        command: /usr/local/bin/init-definitions.sh

    db_postgres:
        image: docker.io/pgvector/pgvector:pg16
        container_name: db_postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: ${API_PG_DB_USERNAME}
            POSTGRES_PASSWORD: ${API_PG_DB_PASSWORD}
            POSTGRES_DB: ${API_PG_DB_DATABASE}
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d
        networks:
            - kodus-backend-services
        restart: unless-stopped
        healthcheck:
            # Over TCP: during initdb the image runs a temporary server on the
            # socket only and then restarts, so a socket check passes while
            # services connecting by host (the Runtime services, the API) are
            # refused, and the first boot of an empty volume races.
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -h 127.0.0.1 -U ${API_PG_DB_USERNAME} -d ${API_PG_DB_DATABASE}',
                ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 30s
        logging: *default-logging

    db_mongodb:
        image: docker.io/mongo:8.2.11
        container_name: mongodb
        ports:
            - '27017:27017'
        volumes:
            - mongodbdata:/data/db
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${API_MG_DB_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${API_MG_DB_PASSWORD}
            MONGO_INITDB_DATABASE: ${API_MG_DB_DATABASE}
        networks:
            - kodus-backend-services
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin | grep -q 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 40s
        logging: *default-logging

volumes:
    node_modules_cache:
    pnpm_store:
    logs_data:
    web_node_modules_cache:
    web_next_cache:
    try_node_modules_cache:
    try_next_cache:
    pgdata:
    mongodbdata:
    pyroscope-data:
    rabbitmq-data:
    runtime_streams:
    runtime_evidence:
    runtime_minio:

networks:
    kodus-backend-services:
        driver: bridge
        name: kodus-backend-services
        external: true
    shared-network:
        external: true
