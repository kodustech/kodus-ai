## Segurança básica
loopback_users.guest = false

## Listeners
listeners.tcp.default = 5672

## Management UI
management.tcp.ip   = 0.0.0.0
management.tcp.port = 15672

## Prometheus (métricas nativas)
prometheus.tcp.ip   = 0.0.0.0
prometheus.tcp.port = 15692

## Limites (tuneáveis por ambiente)
channel_max                        = 2048
vm_memory_high_watermark.relative  = 0.40
disk_free_limit.relative           = 1.20
cluster_partition_handling         = pause_minority

## Timeout de entrega ao consumidor (precisa ficar acima do timeout de code
## review do app, 1h45min, mais a margem de limpeza: sem esta chave o RabbitMQ
## aplica 30min e fecha o canal de reviews longos com PRECONDITION_FAILED)
consumer_timeout = 7200000
