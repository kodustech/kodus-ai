# A pattern must parse in EVERY language a rule declares, so rules are split by
# language rather than grouped by vulnerability class.
rules:
  - id: kodus-command-injection-shell-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Shell command built from an interpolated value. A value containing `;`,
      `&&`, or backticks executes as a separate command. Use the argument-array
      form (`execFile`/`spawn` with a list) so no shell is involved.
    metadata:
      cwe: 'CWE-78'
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: 'exec(`...${$X}...`, ...)'
      - pattern: 'execSync(`...${$X}...`, ...)'
      - pattern: '$CP.exec(`...${$X}...`, ...)'
      - pattern: '$CP.execSync(`...${$X}...`, ...)'
      - pattern: '$CP.spawn($CMD, ..., {..., shell: true, ...})'
      - pattern: '$CP.spawnSync($CMD, ..., {..., shell: true, ...})'

  - id: kodus-command-injection-shell-python
    languages: [python]
    severity: ERROR
    message: >-
      Subprocess invoked through a shell with an interpolated value. Pass the
      command as a list and leave `shell` unset.
    metadata:
      cwe: 'CWE-78'
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: 'subprocess.$F(..., shell=True, ...)'
      - pattern: 'os.system(f"...{$X}...")'
      - pattern: 'os.system("..." % $X)'
      - pattern: 'os.system("..." + $X)'
      - pattern: 'os.popen(f"...{$X}...")'

  - id: kodus-command-injection-concat-java
    languages: [java]
    severity: ERROR
    message: >-
      Runtime command built by concatenation. Pass the program and its
      arguments as separate array elements instead.
    metadata:
      cwe: 'CWE-78'
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: 'Runtime.getRuntime().exec($A + $B)'
      - pattern: 'new ProcessBuilder($A + $B)'

  - id: kodus-code-injection-eval-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Dynamic evaluation of a non-literal value. Anything reaching this call is
      executed as code. Replace with an explicit dispatch table or a parser.
    metadata:
      cwe: 'CWE-94'
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: 'eval($X)'
          - pattern: 'new Function($X)'
      - pattern-not: 'eval("...")'
      - pattern-not: 'new Function("...")'

  - id: kodus-code-injection-eval-python
    languages: [python]
    severity: ERROR
    message: >-
      Dynamic evaluation of a non-literal value. Anything reaching this call is
      executed as code. Use ast.literal_eval for data, or an explicit dispatch.
    metadata:
      cwe: 'CWE-94'
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: 'eval($X)'
          - pattern: 'exec($X)'
      - pattern-not: 'eval("...")'
      - pattern-not: 'exec("...")'

  - id: kodus-unsafe-deserialization-python
    languages: [python]
    severity: ERROR
    message: >-
      Deserializing untrusted input reconstructs arbitrary objects and can
      execute code during construction. Use JSON, or yaml.safe_load.
    metadata:
      cwe: 'CWE-502'
      category: security
      confidence: HIGH
    pattern-either:
      - pattern: 'pickle.loads(...)'
      - pattern: 'cPickle.loads(...)'
      - pattern: 'yaml.load($X)'

  - id: kodus-unsafe-deserialization-php
    languages: [php]
    severity: ERROR
    message: >-
      unserialize() on untrusted input instantiates arbitrary classes and can
      trigger code execution through magic methods. Use json_decode.
    metadata:
      cwe: 'CWE-502'
      category: security
      confidence: HIGH
    patterns:
      - pattern: 'unserialize(...)'
      - pattern-not: 'unserialize("...")'

  - id: kodus-unsafe-deserialization-java
    languages: [java]
    severity: ERROR
    message: >-
      Java native deserialization of untrusted input enables gadget-chain code
      execution. Use a data-only format, or restrict resolveClass to an
      allowlist.
    metadata:
      cwe: 'CWE-502'
      category: security
      confidence: HIGH
    pattern: 'new ObjectInputStream(...)'

  - id: kodus-unsafe-deserialization-ruby
    languages: [ruby]
    severity: ERROR
    message: >-
      Marshal.load on untrusted input reconstructs arbitrary objects and can
      execute code. Use JSON.parse.
    metadata:
      cwe: 'CWE-502'
      category: security
      confidence: HIGH
    pattern: 'Marshal.load(...)'

  - id: kodus-path-traversal-python
    languages: [python]
    severity: ERROR
    message: >-
      File path assembled from an interpolated value. A value containing `../`
      escapes the intended directory. Resolve the path and verify it stays
      inside the permitted root.
    metadata:
      cwe: 'CWE-22'
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: 'open(f"...{$X}...", ...)'
      - pattern: 'open("..." + $X, ...)'
      - pattern: 'open(os.path.join($DIR, $X), ...)'

  - id: kodus-path-traversal-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      File path assembled from an interpolated value. A value containing `../`
      escapes the intended directory. Resolve the path and verify it stays
      inside the permitted root.
    metadata:
      cwe: 'CWE-22'
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: '$FS.readFile(`...${$X}...`, ...)'
      - pattern: '$FS.readFileSync(`...${$X}...`, ...)'
      - pattern: '$FS.createReadStream(`...${$X}...`, ...)'
