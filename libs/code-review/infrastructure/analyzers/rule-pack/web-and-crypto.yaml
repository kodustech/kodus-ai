rules:
  - id: kodus-ssrf-request-non-constant-python
    languages: [python]
    severity: ERROR
    message: >-
      Outbound request to a caller-supplied URL. Without an allowlist this
      reaches internal services and cloud metadata endpoints. Validate the
      resolved host before requesting it.
    metadata:
      cwe: 'CWE-918'
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: 'requests.$M($URL, ...)'
          - pattern: 'urllib.request.urlopen($URL, ...)'
      - pattern-not: 'requests.$M("...", ...)'
      - pattern-not: 'urllib.request.urlopen("...", ...)'

  - id: kodus-ssrf-request-non-constant-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Outbound request to a caller-supplied URL. Without an allowlist this
      reaches internal services and cloud metadata endpoints. Validate the
      resolved host before requesting it.
    metadata:
      cwe: 'CWE-918'
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: 'fetch($URL, ...)'
          - pattern: 'axios.$M($URL, ...)'
      - pattern-not: 'fetch("...", ...)'
      - pattern-not: 'axios.$M("...", ...)'
      - pattern-not: 'fetch(`...`, ...)'

  - id: kodus-ssrf-open-uri-ruby
    languages: [ruby]
    severity: ERROR
    message: >-
      open-uri request to a caller-supplied URL. Validate the resolved host
      against an allowlist before requesting it.
    metadata:
      cwe: 'CWE-918'
      category: security
      confidence: MEDIUM
    patterns:
      - pattern: 'URI.parse($URL).open(...)'
      - pattern-not: 'URI.parse("...").open(...)'
      - pattern-not: 'URI.parse($C).open(...)'

  - id: kodus-xxe-doctype-allowed
    languages: [java]
    severity: ERROR
    message: >-
      XML parser created without disabling DOCTYPE declarations, so an external
      entity can read local files or reach internal hosts. Call
      setFeature("http://apache.org/xml/features/disallow-doctype-decl", true).
    metadata:
      cwe: 'CWE-611'
      category: security
      confidence: MEDIUM
    patterns:
      - pattern: '$F = DocumentBuilderFactory.newInstance();'
      - pattern-not-inside: |
          $F = DocumentBuilderFactory.newInstance();
          ...
          $F.setFeature("=~/disallow-doctype-decl/", true);

  - id: kodus-xss-raw-html-assignment
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Non-literal value assigned as raw HTML. Anything markup-shaped reaching
      this is parsed as HTML. Assign through textContent, or escape the value.
    metadata:
      cwe: 'CWE-79'
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: '$EL.innerHTML = $X'
          - pattern: '$EL.outerHTML = $X'
          - pattern: '$EL.insertAdjacentHTML($POS, $X)'
          - pattern: 'document.write($X)'
      # A constant string is authored markup, not injected markup.
      - pattern-not: '$EL.innerHTML = "..."'
      - pattern-not: '$EL.outerHTML = "..."'
      - pattern-not: '$EL.innerHTML = `...`'
      - pattern-not: '$EL.outerHTML = `...`'
      - pattern-not: '$EL.insertAdjacentHTML($POS, "...")'
      - pattern-not: 'document.write("...")'
      # Explicitly sanitized output is the fix, not the finding.
      - pattern-not: '$EL.innerHTML = DOMPurify.sanitize(...)'
      - pattern-not: '$EL.innerHTML = $S.sanitize(...)'
      - pattern-not: '$EL.innerHTML = escapeHtml(...)'

  - id: kodus-xss-html-in-template-string
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML markup built in a template string with an interpolated value. If the
      value is attacker-controlled it closes the attribute or tag. Escape each
      interpolated value, or build nodes through the DOM API.
    metadata:
      cwe: 'CWE-79'
      category: security
      confidence: LOW
    pattern-regex: '`[^`]*<[a-zA-Z][^`]*\$\{[^`]*`'

  - id: kodus-weak-hash-python
    languages: [python]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are collision-broken and unsuitable for signatures, tokens,
      or password handling. Use SHA-256 or better.
    metadata:
      cwe: 'CWE-327'
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: 'hashlib.md5(...)'
      - pattern: 'hashlib.sha1(...)'

  - id: kodus-weak-hash-js
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are collision-broken and unsuitable for signatures or
      tokens. Use SHA-256 or better.
    metadata:
      cwe: 'CWE-327'
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: 'crypto.createHash("md5")'
      - pattern: 'crypto.createHash("sha1")'

  - id: kodus-weak-hash-java
    languages: [java]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are collision-broken and unsuitable for signatures or
      tokens. Use SHA-256 or better.
    metadata:
      cwe: 'CWE-327'
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: 'MessageDigest.getInstance("MD5")'
      - pattern: 'MessageDigest.getInstance("SHA-1")'

  - id: kodus-cipher-ecb-mode-java
    languages: [java]
    severity: ERROR
    message: >-
      ECB mode encrypts identical plaintext blocks to identical ciphertext, so
      it leaks structure. Use an authenticated mode such as GCM.
    metadata:
      cwe: 'CWE-327'
      category: security
      confidence: HIGH
    pattern: 'Cipher.getInstance("=~/ECB/")'

  - id: kodus-cipher-ecb-mode-python
    languages: [python]
    severity: ERROR
    message: >-
      ECB mode encrypts identical plaintext blocks to identical ciphertext, so
      it leaks structure. Use an authenticated mode such as GCM.
    metadata:
      cwe: 'CWE-327'
      category: security
      confidence: HIGH
    pattern: 'AES.new($K, AES.MODE_ECB, ...)'
