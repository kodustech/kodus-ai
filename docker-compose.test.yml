services:
    db_postgres:
        image: docker.io/pgvector/pgvector:pg16
        container_name: postgres
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: ${API_PG_DB_USERNAME}
            POSTGRES_PASSWORD: ${API_PG_DB_PASSWORD}
            POSTGRES_DB: ${API_PG_DB_DATABASE}
        networks:
            - kodus-backend-services-test
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${API_PG_DB_USERNAME} -d ${API_PG_DB_DATABASE}',
                ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 30s

    # PgBouncer in TRANSACTION mode in front of db_postgres, configured the
    # way the self-hosted docs recommend (track_extra_parameters for the
    # timeouts Kodus sends at connect). The lock and event-bridge
    # integration specs run against it as well as against Postgres directly
    # (TEST_PGBOUNCER_PORT), so anything that needs a real session fails
    # here instead of on a customer's pooler.
    db_pgbouncer:
        image: docker.io/edoburu/pgbouncer:v1.26.1-p0
        container_name: pgbouncer
        ports:
            - '6432:5432'
        environment:
            DB_HOST: db_postgres
            DB_PORT: '5432'
            DB_USER: ${API_PG_DB_USERNAME}
            DB_PASSWORD: ${API_PG_DB_PASSWORD}
            DB_NAME: ${API_PG_DB_DATABASE}
            POOL_MODE: transaction
            AUTH_TYPE: scram-sha-256
            DEFAULT_POOL_SIZE: '5'
            MAX_CLIENT_CONN: '500'
        # The image has no env for track_extra_parameters: let its
        # entrypoint write the ini, append the line, then start pgbouncer.
        entrypoint:
            - /bin/sh
            - -c
            - >-
                /entrypoint.sh true &&
                echo 'track_extra_parameters = statement_timeout,idle_in_transaction_session_timeout' >> /etc/pgbouncer/pgbouncer.ini &&
                exec pgbouncer /etc/pgbouncer/pgbouncer.ini
        depends_on:
            db_postgres:
                condition: service_healthy
        networks:
            - kodus-backend-services-test

    db_mongodb:
        image: docker.io/mongo:8.2.11
        container_name: mongodb
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${API_MG_DB_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${API_MG_DB_PASSWORD}
            MONGO_INITDB_DATABASE: ${API_MG_DB_DATABASE}
        networks:
            - kodus-backend-services-test
        # Nothing here declares `depends_on`, so this healthcheck exists for the
        # caller: `docker compose up --wait` blocks on it, and a mongod that
        # exits on startup is reported as unhealthy instead of leaving a test
        # suite to fail later against a name that no longer resolves.
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin | grep -q 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 40s

networks:
  kodus-backend-services-test:
    external: true
