<script>
/*
 * Kodus first-touch attribution.
 *
 * Paste this whole file into a Custom HTML tag, triggered on
 * "Initialization - All Pages", in both GTM containers: GTM-KN2J57G (kodus.io)
 * and GTM-T2TMHK7K (app.kodus.io). Publish only after the API that accepts
 * `firstTouch` is in production.
 *
 * On the first visit to kodus.io or app.kodus.io it stores where the visitor
 * came from in the cookie `kodus_first_touch` on .kodus.io. It never
 * overwrites an existing cookie. The app reads it at signup and the API stores
 * it on the new organization. ES5 on purpose: GTM rejects newer syntax in
 * Custom HTML.
 */
(function () {
  var COOKIE = 'kodus_first_touch';
  // Production only: the app container loads in every environment (QA,
  // previews, e2e), and a visit there would write this production cookie.
  var HOSTS = ['kodus.io', 'www.kodus.io', 'app.kodus.io'];
  var MAX_AGE = 60 * 60 * 24 * 365;
  var PARAMS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid'];
  // The API is the filter and cleans every value again. This only keeps out of
  // the cookie a newsletter link's reader address carried in a UTM, which
  // URLSearchParams has already decoded once.
  var AT = /@|%40/i;
  var GCLID = /^[A-Za-z0-9_-]{1,255}$/;
  // A UTF-8 lead byte at the end with fewer continuation bytes than it needs.
  var PARTIAL_CHAR = /(?:%[CD][0-9A-F]|%E[0-9A-F](?:%[89AB][0-9A-F])?|%F[0-7](?:%[89AB][0-9A-F]){0,2})$/i;

  // Never cut an emoji in half: encodeURIComponent throws on the leftover.
  function cut(text, max) {
    return text.slice(0, max).replace(/[\uD800-\uDBFF]$/, '');
  }

  // Nor leave half a %XX escape at the end of a URL, or part of a character
  // encoded in several: /%E2%9C%93 cut to /%E2%9C no longer decodes.
  function cutUrl(url, max) {
    return cut(url, max).replace(/%[0-9A-Fa-f]?$/, '').replace(PARTIAL_CHAR, '');
  }

  // Rebuilt whole at each size, so the landing page's query always carries
  // the same values as the fields.
  function build(valueMax, urlMax, landingQuery) {
    var touch = {};
    var kept = [];
    var query = new URLSearchParams(location.search);
    for (var i = 0; i < PARAMS.length; i++) {
      var full = (query.get(PARAMS[i]) || '').slice(0, 400).replace(/^\s+|\s+$/g, '');
      if (!full || AT.test(full)) continue;
      // A cut click id no longer identifies the click: whole or nothing, at
      // any size.
      if (PARAMS[i] === 'gclid' && !GCLID.test(full)) continue;
      var value = PARAMS[i] === 'gclid' ? full : cut(full, valueMax);
      touch[PARAMS[i]] = value;
      kept.push(encodeURIComponent(PARAMS[i]) + '=' + encodeURIComponent(value));
    }

    // Referrer and landing page without query strings or fragments, which is
    // where personal data in a URL usually lives.
    var referrer = document.referrer.split(/[?#]/)[0];
    if (referrer) touch.referrer = cutUrl(referrer, urlMax);
    touch.landing_page = location.origin + cutUrl(location.pathname, urlMax) +
      (landingQuery && kept.length ? '?' + kept.join('&') : '');
    touch.captured_at = new Date().toISOString();

    return encodeURIComponent(JSON.stringify(touch));
  }

  try {
    if (HOSTS.indexOf(location.hostname) < 0) return;
    if (new RegExp('(?:^|;\\s*)' + COOKIE + '=').test(document.cookie)) return;

    var cookie = build(100, 300, true);
    // Browsers drop cookies over 4KB without a word; non-ASCII UTMs can get
    // there. Shorter values, and the landing page without its query (the
    // fields still carry the values).
    if (cookie.length > 3500) cookie = build(40, 100, false);

    document.cookie = COOKIE + '=' + cookie + '; Domain=.kodus.io; Path=/; Max-Age=' + MAX_AGE +
      '; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
  } catch (e) {
    // Attribution is best effort: never break the page.
  }
})();
</script>
